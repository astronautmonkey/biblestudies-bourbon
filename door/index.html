<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#24363a">
<title>It's your door!</title>
<style>
  :root{
    --ink:#1b2a2d; --panel:#24363a; --line:#3d5559; --cream:#f4ecd8; --muted:#a9bdb6;
    --gold:#e9c46a; --grass:#9aa72a; --s:1;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:var(--mono);
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
  canvas{display:block}
  .hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));
    pointer-events:none;font-weight:700;text-shadow:0 2px 0 rgba(27,42,45,.55)}
  .hud .score{font-size:clamp(22px,5vw,34px);line-height:1;text-align:right}
  .hud .sub{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;text-align:right}
  .hud .who{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  #mute{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 10px;border:2px solid rgba(244,236,216,.5);
    background:rgba(27,42,45,.45);border-radius:4px}
  .prompt{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;padding:0 16px;
    text-shadow:0 2px 0 rgba(27,42,45,.6)}
  .prompt h2{margin:0 0 8px;font-size:clamp(20px,5.2vw,34px);letter-spacing:.02em}
  .prompt p{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .blink{animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.blink{animation:none}}

  .screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    background:rgba(27,42,45,.72);display:flex;flex-direction:column;align-items:center;
    padding:max(18px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
  .screen.center{justify-content:center}
  h1{margin:6px 0 2px;font-size:clamp(30px,8vw,56px);line-height:1;letter-spacing:-.01em;text-align:center;
    color:var(--cream);text-shadow:3px 3px 0 var(--grass),6px 6px 0 var(--ink)}
  .lede{margin:10px 0 16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(100%,700px)}
  @media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
  .pair{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:2px solid var(--line);border-radius:6px;overflow:hidden}
  .pair.solo{grid-template-columns:1fr;width:calc(50% - 1px)}
  .card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;
    padding:8px 2px 7px;min-height:44px}
  .card + .card{border-left:1px solid var(--line)}
  .card:hover,.card:focus-visible{background:rgba(233,196,106,.16);outline:none}
  .card:active{background:rgba(233,196,106,.28)}
  .card .nm{font-size:11px;font-weight:700;letter-spacing:.04em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .card .pb{font-size:10px;color:var(--muted);letter-spacing:.04em}
  .card.lead{box-shadow:inset 0 0 0 2px var(--gold)}
  .card.lead::after{content:"TOP";position:absolute;top:0;right:0;background:var(--gold);color:var(--ink);
    font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 5px;border-radius:0 0 0 5px}
  .spr{width:calc(var(--cw)*var(--s)*1px);height:calc(var(--ch)*var(--s)*1px);background-repeat:no-repeat;
    background-size:calc(var(--sw)*var(--s)*1px) calc(var(--ch)*var(--s)*1px);image-rendering:auto;flex:none}
  .spr.head{height:calc(46*var(--s)*1px)}

  .board{width:min(100%,360px);margin-top:20px}
  .board h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
  .board ol{list-style:none;margin:0;padding:0;border:2px solid var(--line);border-radius:6px;background:var(--panel)}
  .board li{display:flex;align-items:center;gap:10px;padding:5px 12px;border-top:1px solid var(--line);font-size:13px}
  .board li:first-child{border-top:0}
  .board li.me{background:rgba(233,196,106,.16)}
  .board .rk{width:1.6em;color:var(--muted);font-variant-numeric:tabular-nums}
  .board .nm{flex:1;font-weight:700}
  .board .m{font-variant-numeric:tabular-nums}
  .board .empty{padding:14px;text-align:center;color:var(--muted);font-size:12px;display:block}
  .over{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:20px 18px 18px;width:min(100%,380px);
    text-align:center;--s:.62}
  .over .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);min-height:1.2em;margin:0 0 6px}
  .over .big{font-size:clamp(34px,10vw,52px);font-weight:700;line-height:1;margin:0}
  .over .det{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
  .over .board{margin-top:16px;width:100%}
  .btns{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;padding:13px 8px;border-radius:6px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    border:2px solid var(--line);background:transparent}
  .btn.go{background:var(--gold);border-color:var(--gold);color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="It's your door! game"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="who" id="hudWho"></div>
    <div><div class="score" id="hudScore">0 m</div><div class="sub" id="hudSub"></div></div>
  </div>

  <div class="prompt" id="ready" hidden>
    <h2 id="readyTitle"></h2>
    <p class="blink">Tap to start &middot; tap to jump</p>
  </div>

  <div class="screen" id="select">
    <h1>It's your door!</h1>
    <p class="lede">Pick who's up</p>
    <div class="grid" id="grid"></div>
    <div class="board"><h3>Leaderboard</h3><ol id="boardMain"></ol></div>
  </div>

  <div class="screen center" id="over" hidden>
    <div class="over">
      <p class="tag" id="overTag"></p>
      <p class="big" id="overScore"></p>
      <p class="det" id="overDet"></p>
      <div class="board"><ol id="boardOver"></ol></div>
      <div class="btns">
        <button class="btn" id="btnSwitch">Switch player</button>
        <button class="btn go" id="btnAgain">Go again</button>
      </div>
    </div>
  </div>

  <button id="mute" aria-pressed="false">Sound on</button>
</div>

const IMG = {};
function loadAll(){
  const jobs = [];
  const add = (key, src) => jobs.push(new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; IMG[key] = i; }));
  for (const n of NAMES) add('c:' + n, CHARS[n].src);
  for (const k in ENV) add(k, ENV[k].src);
  return Promise.all(jobs);
}

// Obstacles grouped by how hard they are to clear.

};

/* ---------------- scores ---------------- */
const STORE = 'its-your-door.v1';
let scores = {};
try { scores = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) {}
function saveScores(){ try { localStorage.setItem(STORE, JSON.stringify(scores)); } catch (e) {} }
function ranked(){ return NAMES.filter(n => scores[n] > 0).sort((a, b) => scores[b] - scores[a]); }
// Shared scoreboard. When it can be reached, it is the source of truth: the board shows exactly what it holds.
// This phone keeps a copy for offline use, and any run it couldn't send (no signal) waits in a queue and is
// sent on the next sync. The server only ever keeps the higher score, so re-sending is harmless.
const PENDING = STORE + '.pending';
let pending = {};
try { pending = JSON.parse(localStorage.getItem(PENDING) || '{}') || {}; } catch (e) {}
function savePending(){ try { localStorage.setItem(PENDING, JSON.stringify(pending)); } catch (e) {} }
let syncing = false;
function applyRemote(remote){
  if (!remote || typeof remote !== 'object' || remote.error) return;
  const next = {};
  for (const n of NAMES) {
    const v = Math.max(Math.floor(Number(remote[n]) || 0), pending[n] || 0);
    if (v > 0) next[n] = v;
  }
  scores = next; saveScores();
  if (G.state === 'menu') renderSelect();
  if (!$('over').hidden) refreshOverBoard();
}
function pullShared(){
  if (!LEADERBOARD_URL || syncing) return;
  syncing = true;
  fetch(LEADERBOARD_URL, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(remote => { applyRemote(remote); for (const n in pending) pushShared(n, pending[n]); })
    .catch(() => {}).finally(() => { syncing = false; });
}
function pushShared(name, score){
  if (!LEADERBOARD_URL) return;
  pending[name] = Math.max(pending[name] || 0, score); savePending();
  fetch(LEADERBOARD_URL, { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, score }) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(remote => { if (pending[name] <= score) delete pending[name]; savePending(); applyRemote(remote); })
    .catch(() => {});
}
setInterval(() => { if (G.state === 'menu' && !document.hidden) pullShared(); }, 15000);   // keep the pick screen fresh while people play
document.addEventListener('visibilitychange', () => { if (!document.hidden) pullShared(); });

/* ---------------- sound ---------------- */
let AC = null, muted = false;
try { muted = localStorage.getItem(STORE + '.mute') === '1'; } catch (e) {}
function audio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f0, f1, dur, type = 'square', vol = 0.06, at = 0){
  if (muted || !AC) return;
  const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}

function resetRun(){
  Object.assign(G, { dist: 0, t: 0, speed: SPEED0, y: 0, vy: 0, onGround: true, held: false, buffer: 0, anim: 0,
                     obstacles: [], gaps: [], doors: 0, deadT: 0, sunk: false, drops: [], pops: [] });
  G.nextX = W + 260;
}

function spawn(){
  const m = metres(), d = Math.min(1, m / 1400), x = G.nextX;
  let width;
  const nearDoor = Math.abs(((x - doorX(0)) % (DOOR_EVERY * PPM) + DOOR_EVERY * PPM) % (DOOR_EVERY * PPM) - DOOR_EVERY * PPM / 2) > DOOR_EVERY * PPM / 2 - 140;
  if (m > 400 && !nearDoor && Math.random() < 0.16 + 0.12 * d) {
    width = Math.round(rand(44, 64 + 30 * d));
    G.gaps.push({ x, w: width });
  } else {
    let tier = 'small';
    const r = Math.random();
    if (m > 250 && r < 0.18 + 0.2 * d) tier = 'wide';
    else if (m > 100 && r < 0.55 + 0.25 * d) tier = 'medium';
    const key = pick(POOL[tier]);
    G.obstacles.push({ key, x, w: ENV[key].w, h: ENV[key].h });
    width = ENV[key].w;
    if (m > 600 && tier !== 'wide' && Math.random() < 0.1 + 0.25 * d) {     // a second one right behind it
      const k2 = pick(POOL.small);
      G.obstacles.push({ key: k2, x: x + width + 2, w: ENV[k2].w, h: ENV[k2].h });
      width += 2 + ENV[k2].w;
    }
  }
  G.nextX = x + width + G.speed * rand(0.95 - 0.17 * d, 1.9 - 0.7 * d);
}

function press(){
  if (G.state === 'ready') { audio(); G.state = 'run'; $('ready').hidden = true; jump(); return; }
  if (G.state !== 'run') return;
  G.held = true;
  if (G.onGround) jump(); else G.buffer = 0.12;
}
function release(){ G.held = false; if (G.state === 'run' && G.vy < -220) G.vy = -220; }
function jump(){ G.vy = -JUMP_V; G.onGround = false; G.held = true; G.buffer = 0; SFX.jump(); puff(3); }
function puff(n){ const x = playerX() + CHARS[G.who].cw / 4; for (let i = 0; i < n; i++) G.drops.push({ x: x + rand(-6, 4), y: GROUND + 1, vx: rand(-60, -10), vy: rand(-70, -25), dust: 1, life: 0.3 }); }

function overGap(){
  const c = G.dist + playerX() + CHARS[G.who].cw / 4;
  return G.gaps.some(g => c > g.x + 3 && c < g.x + g.w - 3);
}

function update(dt){
  if (G.state === 'menu' || G.state === 'ready') { G.menuScroll += dt * (G.state === 'menu' ? 28 : 0); return; }
  if (G.state === 'dead') {
    G.deadT += dt;
    if (G.sunk) { G.vy += GRAVITY * dt; G.y += G.vy * dt; }
    stepDrops(dt);
    if (G.deadT > 0.75 && $('over').hidden) showOver();
    return;
  }
  G.t += dt;
  G.speed = G.speed < SPEED_FAST ? Math.min(SPEED_FAST, SPEED0 + SPEED_RAMP * G.t) : Math.min(SPEED_MAX, G.speed + dt);
  G.dist += G.speed * dt;
  G.anim += dt * 8 * (1.25 + G.speed / 280);     // 8 frames per two steps; cadence rises with speed
  while (G.nextX < G.dist + W + 80) spawn();
  G.obstacles = G.obstacles.filter(o => o.x + o.w > G.dist - 40);
  G.gaps = G.gaps.filter(g => g.x + g.w > G.dist - 40);

  // vertical motion (y is height above the ground, negative = up)
  if (!G.onGround) {
    G.vy += GRAVITY * dt; G.y += G.vy * dt;
    if (G.y >= 0) {
      if (overGap()) { return die(true); }
      G.y = 0; G.vy = 0; G.onGround = true; G.anim = 4; puff(4);
      if (G.buffer > 0) jump();
    }
  } else if (overGap()) { G.onGround = false; G.vy = 60; return die(true); }
  if (G.buffer > 0) G.buffer -= dt;

  // obstacles
  const c = CHARS[G.who], px = G.dist + playerX(), cw = c.cw / 2;
  const mid = px + cw / 2, a = { l: mid - 5, r: mid + 5, t: GROUND + G.y - 44, b: GROUND + G.y - 2 };
  for (const o of G.obstacles) {
    if (a.r > o.x + 3 && a.l < o.x + o.w - 3 && a.b > GROUND - o.h + 5) return die(false);
  }
  // doors
  const passed = Math.floor(metres() / DOOR_EVERY);
  if (passed > G.doors) { G.doors = passed; SFX.knock(); G.pops.push({ x: doorX(passed), t: 0, text: 'Door ' + passed + '!' }); }
  for (const p of G.pops) p.t += dt;
  G.pops = G.pops.filter(p => p.t < 1.4);
  stepDrops(dt);
  $('hudScore').textContent = metres() + ' m';
}
function stepDrops(dt){
  for (const p of G.drops) { p.vy += (p.dust ? 120 : 700) * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.dust) p.life -= dt; }
  G.drops = G.drops.filter(p => p.y < H + 10 && !(p.dust && p.life <= 0));
}
function die(inWater){
  G.state = 'dead'; G.deadT = 0; G.sunk = inWater;
  if (inWater) {
    SFX.splash(); G.vy = Math.max(G.vy, 120);
    const x = playerX() + CHARS[G.who].cw / 4;
    for (let i = 0; i < 14; i++) G.drops.push({ x, y: GROUND + 8, vx: rand(-70, 70), vy: rand(-260, -90) });
  } else SFX.hit();
}

/* ---------------- drawing ---------------- */
const snap = v => Math.round(v * K) / K;
function tile(key, offset, y, par){             // endlessly repeating strip
  const e = ENV[key], x0 = snap(-((offset * par) % e.w + e.w) % e.w);
  for (let x = x0; x < W; x += e.w) ctx.drawImage(IMG[key], x, y);
}
function draw(){
  const scroll = G.state === 'menu' ? G.menuScroll : G.dist;
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(IMG.sky, 0, 0, Math.max(W, ENV.sky.w), H + 2);
  tile('mtlight', scroll, 34, 0.04);
  tile('bglight', scroll, 70, 0.1);
  tile('bgdark', scroll, 108, 0.2);

  // pines in the middle distance
  const par = 0.55, slot = 96, first = Math.floor(scroll * par / slot) - 2;
  for (let i = first; i < first + W / slot + 5; i++) {
    const r = hash(i); if (r < 0.3) continue;
    const key = TREES[Math.floor(hash(i + 0.5) * TREES.length)], e = ENV[key];
    ctx.drawImage(IMG[key], snap(i * slot + hash(i + 0.25) * 50 - scroll * par), GROUND + 4 - e.h);
  }

  // water, then ground split around the gaps
  const gaps = G.state === 'menu' ? [] : G.gaps.map(g => ({ a: g.x - scroll, b: g.x + g.w - scroll })).filter(g => g.b > -20 && g.a < W + 20).sort((p, q) => p.a - q.a);
  for (const g of gaps) {
    ctx.save(); ctx.beginPath(); ctx.rect(snap(g.a) - 4, GROUND + 8, g.b - g.a + 8, H); ctx.clip();
    tile('water', scroll + performance.now() / 90, GROUND + 8, 1);
    tile('water', scroll + performance.now() / 90, GROUND + 8 + ENV.water.h - 2, 1);
    ctx.restore();
  }
  const gy = GROUND - 9, ge = IMG.ground, MID = 48;
  let from = -MID;
  const seg = (a, b, capL, capR) => {
    a = snap(a); b = snap(b); if (b - a < 2) return;
    ctx.save(); ctx.beginPath(); ctx.rect(a + (capL ? 16 : 0), gy, b - a - (capL ? 16 : 0) - (capR ? 16 : 0), 80); ctx.clip();
    for (let x = snap(-((scroll % MID) + MID) % MID) - MID; x < W + MID; x += MID) if (x + MID > a && x < b) ctx.drawImage(ge, 16, 0, MID, 72, x, gy, MID, 72);
    ctx.restore();
    if (capL) ctx.drawImage(ge, 0, 0, 16, 72, a, gy, 16, 72);
    if (capR) ctx.drawImage(ge, 64, 0, 16, 72, b - 16, gy, 16, 72);
  };
  for (const g of gaps) { seg(from, g.a, from > -MID, true); from = g.b; }
  seg(from, W + MID, from > -MID, false);

  // bushes sitting on the ground behind everything that matters
  const b0 = Math.floor(scroll / 170) - 1;
  for (let i = b0; i < b0 + W / 170 + 3; i++) {
    if (hash(i * 3.3) < 0.45) continue;
    const key = hash(i * 7.1) < 0.6 ? 'bush' : 'bush2', e = ENV[key], wx = i * 170 + hash(i * 1.7) * 60;
    if (G.state !== 'menu' && G.gaps.some(g => wx + e.w > g.x - 6 && wx < g.x + g.w + 6)) continue;
    ctx.drawImage(IMG[key], snap(wx - scroll), GROUND + 3 - e.h);
  }

  if (G.state !== 'menu') {
    // doors
    const k0 = Math.max(1, Math.floor((scroll - 60) / (DOOR_EVERY * PPM)));
    for (let k = k0; k < k0 + 3; k++) {
      const x = snap(doorX(k) - ENV.door.w / 2 - scroll);
      if (x > W || x < -60) continue;
      ctx.drawImage(IMG.door, x, GROUND + 2 - ENV.door.h);
      label(k * DOOR_EVERY + ' m', x + ENV.door.w / 2, GROUND - ENV.door.h - 6, 9);
    }
    for (const o of G.obstacles) ctx.drawImage(IMG[o.key], snap(o.x - scroll), GROUND + 2 - o.h);
    drawPlayer();
    for (const p of G.drops) { ctx.fillStyle = p.dust ? '#d9cfa3' : '#bfe9f5'; ctx.fillRect(snap(p.x), snap(p.y), 2, 2); }
    for (const p of G.pops) { ctx.globalAlpha = Math.max(0, 1 - p.t / 1.4); label(p.text, p.x - scroll, GROUND - 78 - p.t * 18, 11, '#e9c46a'); ctx.globalAlpha = 1; }
  }
}
function label(text, x, y, size, color = '#f4ecd8'){
  ctx.font = '700 ' + size + 'px ui-monospace, Menlo, Consolas, monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(27,42,45,.7)'; ctx.fillText(text, x + 1, y + 1);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function drawPlayer(){
  const c = CHARS[G.who], img = IMG['c:' + G.who], w = c.cw / 2, h = c.ch / 2;
  let f = 0;
  if (G.state === 'run' || G.state === 'dead') f = 1 + (G.onGround ? Math.floor(G.anim) % c.n : (G.vy < 0 ? c.n : c.n + 1));   // after the run cycle come two jump poses: rising, falling
  if (G.state === 'dead' && !G.sunk && Math.floor(G.deadT * 12) % 2) return;       // blink on a hit
  ctx.imageSmoothingEnabled = K % 2 === 1;
  const x = snap(playerX()), y = snap(GROUND + 2 + G.y - h);
  if (G.sunk) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, GROUND + 12); ctx.clip(); }
  ctx.drawImage(img, f * c.cw, 0, c.cw, c.ch, x, y, w, h);
  if (G.sunk) ctx.restore();
  ctx.imageSmoothingEnabled = false;
}

/* ---------------- screens ---------------- */
function sprite(name, head){
  const c = CHARS[name], el = document.createElement('span');
  el.className = 'spr' + (head ? ' head' : '');
  el.style.cssText = `--cw:${c.cw};--ch:${c.ch};--sw:${c.cw * (c.n + 1)};background-image:url(${c.src})`;
  return el;
}
function renderBoard(ol, me, limit){
  ol.textContent = '';
  const list = ranked();
  if (!list.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'No runs yet. Somebody take the first door.'; ol.append(li); return; }
  let shown = list.slice(0, limit);
  if (me && !shown.includes(me) && list.includes(me)) shown = [...shown.slice(0, limit - 1), me];
  for (const n of shown) {
    const li = document.createElement('li'); if (n === me) li.className = 'me';
    const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = (list.indexOf(n) + 1) + '.';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = nice(n);
    const m = document.createElement('span'); m.className = 'm'; m.textContent = scores[n] + ' m';
    const s = sprite(n, true); s.style.setProperty('--s', '.42');
    li.append(rk, s, nm, m); ol.append(li);
  }
}
function renderSelect(){
  const grid = $('grid'); grid.textContent = '';
  const lead = ranked()[0];
  document.documentElement.style.setProperty('--s', innerWidth < 420 ? '.6' : innerWidth < 640 ? '.72' : '.9');
  for (const group of COUPLES) {
    const pair = document.createElement('div'); pair.className = 'pair' + (group.length === 1 ? ' solo' : '');
    for (const n of group) {
      if (!CHARS[n]) continue;
      const b = document.createElement('button'); b.className = 'card' + (n === lead ? ' lead' : ''); b.type = 'button';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = nice(n);
      const pb = document.createElement('span'); pb.className = 'pb'; pb.textContent = scores[n] ? scores[n] + ' m' : '–';
      b.append(sprite(n), nm, pb);
      b.addEventListener('click', () => choose(n));
      pair.append(b);
    }
    grid.append(pair);
  }
  renderBoard($('boardMain'), null, 15);
}
function showMenu(){ pullShared(); G.state = 'menu'; $('select').hidden = false; $('over').hidden = true; $('hud').hidden = true; $('ready').hidden = true; renderSelect(); }
function choose(n){ audio(); G.who = n; getReady(); }
function getReady(){
  pullShared(); resetRun(); G.state = 'ready';
  $('select').hidden = true; $('over').hidden = true; $('hud').hidden = false; $('ready').hidden = false;
  $('readyTitle').textContent = "It's your door, " + nice(G.who) + '!';
  $('hudWho').textContent = nice(G.who); $('hudScore').textContent = '0 m';
  const top = ranked()[0];
  $('hudSub').textContent = top ? 'Top ' + scores[top] + ' m · ' + nice(top) : '';
}
function showOver(){
  const m = metres(), prev = scores[G.who] || 0, topBefore = ranked()[0], topScore = topBefore ? scores[topBefore] : 0;
  G.lastRun = { m, prev };
  if (m > prev) { scores[G.who] = m; saveScores(); pushShared(G.who, m); if (m > 0) SFX.best(); }
  else if (LEADERBOARD_URL) pullShared();
  $('overScore').textContent = m + ' m';
  refreshOverBoard();
  $('over').hidden = false; $('hud').hidden = true;
  setTimeout(() => $('btnAgain').focus({ preventScroll: true }), 50);
}
function refreshOverBoard(){
  const { m, prev } = G.lastRun || { m: 0, prev: 0 }, best = scores[G.who] || 0, top = ranked()[0];
  let tag = '';
  if (m > prev && m > 0) tag = (top === G.who && best === m) ? 'New top score!' : 'New personal best';
  $('overTag').textContent = tag;
  $('overDet').textContent = nice(G.who) + ' \u00b7 ' + G.doors + (G.doors === 1 ? ' door' : ' doors') + (m < best ? ' \u00b7 best ' + best + ' m' : '');
  renderBoard($('boardOver'), G.who, 5);
}
$('btnAgain').addEventListener('click', () => getReady());
$('btnSwitch').addEventListener('click', () => showMenu());
function paintMute(){ $('mute').textContent = muted ? 'Sound off' : 'Sound on'; $('mute').setAttribute('aria-pressed', String(muted)); }
$('mute').addEventListener('click', e => { muted = !muted; try { localStorage.setItem(STORE + '.mute', muted ? '1' : '0'); } catch (err) {} paintMute(); audio(); e.currentTarget.blur(); });

/* ---------------- input ---------------- */
const stage = $('stage');
stage.addEventListener('pointerdown', e => { if (e.target.closest('button, .screen')) return; e.preventDefault(); press(); });
addEventListener('pointerup', release); addEventListener('pointercancel', release);
addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'ArrowUp' && e.code !== 'Enter') return;
  if (G.state === 'menu') return;
  if (G.state === 'dead') { if (!$('over').hidden && !e.repeat && e.code !== 'Enter') { e.preventDefault(); getReady(); } return; }
  e.preventDefault(); if (!e.repeat) press();
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') release(); });
stage.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- sizing + loop ---------------- */
function resize(){
  const vw = innerWidth, vh = innerHeight;
  W = Math.round(Math.min(640, Math.max(400, H * vw / vh)));
  const scale = Math.min(vw / W, vh / H), cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
  K = Math.min(4, Math.max(1, Math.ceil(cssH * Math.min(3, devicePixelRatio || 1) / H)));
  cv.width = W * K; cv.height = H * K; cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  if (G.state === 'menu' && !$('select').hidden) document.documentElement.style.setProperty('--s', vw < 420 ? '.6' : vw < 640 ? '.72' : '.9');
}
addEventListener('resize', resize);
let last = 0;
function frame(now){
  const dt = Math.min(0.033, (now - last) / 1000 || 0); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); });

loadAll().then(() => { resize(); paintMute(); showMenu(); requestAnimationFrame(t => { last = t; frame(t); }); });
window.__game = G;
</script>
</body>
